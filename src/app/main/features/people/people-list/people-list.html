<div class="container">
  <div class="row">
    <div class="col">
      <h2>{{ html.title | translate }}</h2>
    </div>
    <div class="col text-end">
      <button type="button" class="btn btn-primary" (click)="onNewRegister()">
        {{ html.newRegistration | translate }}
      </button>
    </div>
  </div>
  <div class="row">
    <app-table [tableConfig]="configTable()"></app-table>
  </div>
</div>

<app-modal [isOpen]="isOpen()">
  @if (isDeactivating()) {
    <app-modal-deactivate
      [person]="havePerson()"
      (closed)="onClosed()"
      (deactivate)="onDeactivate($event)"
    />
  } @else {
    <app-modal-view [person]="havePerson()" (closed)="onClosed()" />
  }
</app-modal>
