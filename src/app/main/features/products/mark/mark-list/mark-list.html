<div class="container">
  <div class="row">
    <div class="col">
      <h2>{{"MAIN.FEATURES.MARK.LISTTITLE" | translate}}</h2>
    </div>
    <div class="col text-end">
      <button type="button" class="btn btn-primary" (click)="onNewRegister()">
        {{"MAIN.FEATURES.MARK.LISTBUTTON" | translate}}
      </button>
    </div>
  </div>
  <div class="row">
    <app-table [tableConfig]="configTable()"></app-table>
  </div>
</div>

<app-modal [isOpen]="openModal()" >
  <app-modal-delete [mark]="markModal()" (onClosed)="onClosed()" (onDelete)="onDelete($event)" />
</app-modal>
