<div class="container">
  <div class="row">
    <div class="col">
      <h2>{{ 'MAIN.FEATURES.PRODUCT_MASTER.COLOR.LISTTITLE' | translate }}</h2>
    </div>
    <div class="col text-end">
      <button type="button" class="btn btn-primary" (click)="onNewRegister()">
        {{ 'MAIN.FEATURES.PRODUCT_MASTER.COLOR.LISTBUTTON' | translate }}
      </button>
    </div>
  </div>
  <div class="row">
    <app-table [tableConfig]="configTable()"></app-table>
  </div>
</div>
<app-modal [isOpen]="openModal()"
  ><app-product-delete-modal
    [name]="selected()?.hexadecimal ?? ''"
    entityKey="MAIN.FEATURES.PRODUCT_MASTER.ENTITIES.COLOR"
    (closed)="closeModal()"
    (confirmed)="deleteSelected()"
/></app-modal>
