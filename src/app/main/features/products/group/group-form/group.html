<div class="container">
  <form>
    <div class="row mb-3 mt-3">
      <div class="col">
        <h1>{{ 'MAIN.FEATURES.PRODUCT_MASTER.GROUP.FORMTITLE' | translate }}</h1>
      </div>
    </div>
    <div class="row mb-3">
      <div class="col">
        <app-form-input
          [fieldTree]="formName"
          [info]="{
            nameLabel: 'MAIN.FEATURES.PRODUCT_MASTER.FIELDS.NAME',
            type: 'text',
            idLabel: 'name',
          }"
          messageId="name"
          type="input"
        />
      </div>
    </div>
    <div class="row">
      <div class="col d-grid gap-2 d-md-flex justify-content-md-end">
        @if (saving()) {
          <img src="../../../../assets/loading.png" alt="Carregando..." class="rounded loading-animation" />
        } @else {
          <button type="button" class="btn btn-danger" (click)="onCancel()">
            {{ 'COMMONS.CANCEL' | translate }}</button
          ><button [disabled]="isDisabled" type="button" class="btn btn-primary" (click)="onSave()">
            {{ 'COMMONS.SAVE' | translate }}
          </button>
        }
      </div>
    </div>
  </form>
</div>
