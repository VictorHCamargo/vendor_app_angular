<div class="login-wrapper d-flex align-items-center justify-content-center vh-100">
  <div
    class="card shadow-lg p-4 border-0"
    style="width: 100%; max-width: 400px; border-radius: 15px"
  >
    <div class="text-center mb-4">
      <h2 class="fw-bold text-primary">{{ 'LOGIN.TITLE' | translate }}</h2>
      <p class="text-muted small">{{ 'LOGIN.SUBTITLE' | translate }}</p>
    </div>

    <form>
      <div class="mb-3">
        <label for="floatingInput" class="form-label fw-semibold">{{
          'LOGIN.EMAIL' | translate
        }}</label>
        <div class="input-group">
          <span class="input-group-text bg-light border-end-0"><i class="bi bi-envelope"></i></span>
          <input
            [field]="formData.email"
            type="email"
            class="form-control border-start-0 bg-light"
            id="floatingInput"
            [placeholder]="'LOGIN.EMAIL_PLACEHOLDER' | translate"
          />
        </div>
        <app-error-messages
          [message]="formData.email()"
          [messageId]="'floatingInput'"
        ></app-error-messages>
      </div>

      <div class="mb-4">
        <label for="floatingPassword" class="form-label fw-semibold">{{
          'LOGIN.PASSWORD' | translate
        }}</label>
        <div class="input-group">
          <span class="input-group-text bg-light border-end-0"><i class="bi bi-lock"></i></span>
          <input
            [field]="formData.password"
            [type]="showPassword() ? 'text' : 'password'"
            class="form-control border-start-0 bg-light"
            id="floatingPassword"
            placeholder="••••••"
          />
          <button
            class="input-group-text bg-white border-start-0"
            type="button"
            (click)="showPassword.set(!showPassword())"
          >
            <i class="bi" [class]="showPassword() ? 'bi-eye-slash' : 'bi-eye'"></i>
            <span class="visually-hidden">{{ 'LOGIN.TOGGLE_PASSWORD' | translate }}</span>
          </button>
        </div>
        <app-error-messages
          [message]="formData.password()"
          [messageId]="'floatingPassword'"
        ></app-error-messages>
      </div>

      @if (!atLogin()) {
        @if (isDisabled) {
          <button
            type="button"
            class="btn btn-primary w-100 py-2 fw-bold shadow-sm"
            style="border-radius: 8px"
            disabled
          >
            {{ 'LOGIN.SUBMIT' | translate }}
          </button>
        } @else {
          <button
            (click)="onSign()"
            type="button"
            class="btn btn-primary w-100 py-2 fw-bold shadow-sm"
            style="border-radius: 8px"
          >
            {{ 'LOGIN.SUBMIT' | translate }}
          </button>
        }
      } @else {
        <button
          type="button"
          class="btn btn-primary w-100 py-2 fw-bold shadow-sm"
          style="border-radius: 8px"
          disabled
        >
          <div class="spinner-border text-light" role="status">
            <span class="visually-hidden">{{ 'COMMONS.LOADING' | translate }}</span>
          </div>
        </button>
      }
    </form>
  </div>
</div>
